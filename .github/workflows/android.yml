name: Android

# The Android app (tekio.rfcs/rfcs/0096-mobile-apps.md): its tests, and a test
# build to sideload. Its client is generated from packages/client/openapi.json
# and its body map read from packages/core/src/bodyMap.json, so a change to
# either rebuilds it too.
#
# The APK is the debug build, `fyi.tekio.app.test`, signed with the test key
# committed in android/app so one build installs over the last. It points at
# staging (`tekio.apiUrl` in android/gradle.properties). It is no release
# build: that is signed with a key that lives outside the repository.

on:
  push:
    branches: [develop]
    paths: ['android/**', 'packages/client/openapi.json', 'packages/core/src/bodyMap.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'packages/client/openapi.json', 'packages/core/src/bodyMap.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew --no-daemon :api:test :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: tekio-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
