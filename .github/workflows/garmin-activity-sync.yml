name: Garmin activity sync

# Pulls Garmin Connect activities into Supabase: cardio ones (cycling/running/
# swimming/rowing, and HIIT mapped by the modality in its name — roadmap 054)
# with Training Effect + HR zones into cardio_sessions, to drive the cardio
# adaptation; sport ones (tennis, volleyball, …) into sport_sessions with duration, avg HR
# and the same Training Effect + HR zones (roadmap 041, 058), the rating left
# for the user. Both claim a hand-logged row
# on the same date before inserting, so a backfill never doubles one. See
# scripts/garmin-sync/README.md for the one-time secret setup (shares the same
# secrets as the sleep sync).

on:
  schedule:
    # Fallback only. The daily run is started at 08:00 Sofia time by pg_cron in
    # Supabase through workflow_dispatch (RFC 0077), because GitHub's schedule
    # has started this job 5–8 hours late. The sync is idempotent, so when both
    # fire, the second run changes nothing.
    - cron: '0 2 * * *'
  workflow_dispatch: # manual "Run workflow" button for testing / backfill
    inputs:
      days:
        description: 'Trailing days to sync (raise for a backfill)'
        default: '7'
      kinds:
        description: 'Which activities: cardio,sport (or just one)'
        default: 'cardio,sport'
      dry_run:
        description: 'Print the plan and the unmapped activity types; write nothing'
        type: boolean
        default: false
      dump:
        description: 'Also upload the raw activity list (every type, every field) as an artifact'
        type: boolean
        default: false
      catalogue:
        description: "Also upload Garmin's activity-type catalogue as an artifact (RFC 0073)"
        type: boolean
        default: false

concurrency:
  group: garmin-activity-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/garmin-sync/requirements.txt

      - run: pip install -r scripts/garmin-sync/requirements.txt

      - run: python scripts/garmin-sync/sync_activities.py
        env:
          GARMIN_TOKENSTORE: ${{ secrets.GARMIN_TOKENSTORE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEKIO_USER_ID: ${{ secrets.TEKIO_USER_ID }}
          # `inputs` is empty on the schedule, so each falls back to the daily default.
          SYNC_DAYS: ${{ inputs.days || '7' }}
          SYNC_KINDS: ${{ inputs.kinds || 'cardio,sport' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          DUMP_PATH: ${{ inputs.dump && 'garmin-activities.json' || '' }}
          CATALOGUE_PATH: ${{ inputs.catalogue && 'garmin-activity-types.json' || '' }}

      # Only on a manual run that asked for it. Fetch it with
      #   gh run download <run id> -n garmin-activities -D scripts/garmin-sync/dumps/
      # (that folder is gitignored — the dump is personal data, not source).
      - if: ${{ inputs.dump }}
        uses: actions/upload-artifact@v4
        with:
          name: garmin-activities
          path: garmin-activities.json
          retention-days: 90

      # Garmin's product catalogue, not personal data — it is committed once
      # decided (scripts/garmin-sync/activity_types.json, RFC 0073).
      - if: ${{ inputs.catalogue }}
        uses: actions/upload-artifact@v4
        with:
          name: garmin-activity-types
          path: garmin-activity-types.json
          retention-days: 90
