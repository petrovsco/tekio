name: Garmin sleep sync

# Pulls Garmin Connect sleep (duration + Sleep Score + HRV) into Supabase sleep_logs.
# See scripts/garmin-sync/README.md for the one-time secret setup.

on:
  schedule:
    # Fallback, and the late catch. The daily run is started at 08:10 Sofia time
    # by pg_cron in Supabase through workflow_dispatch (RFC 0077); this later
    # slot picks up a night the watch had not synced by then.
    - cron: '0 9 * * *'
  workflow_dispatch: # manual "Run workflow" button for testing / backfill
    inputs:
      days:
        description: 'Trailing nights to sync (raise for a backfill)'
        default: '3'

concurrency:
  group: garmin-sleep-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/garmin-sync/requirements.txt

      - run: pip install -r scripts/garmin-sync/requirements.txt

      - run: python scripts/garmin-sync/sync_sleep.py
        env:
          GARMIN_TOKENSTORE: ${{ secrets.GARMIN_TOKENSTORE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEKIO_USER_ID: ${{ secrets.TEKIO_USER_ID }}
          # `inputs` is empty on the schedule, so this falls back to the daily default.
          SYNC_DAYS: ${{ inputs.days || '3' }}
