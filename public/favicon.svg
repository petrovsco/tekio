<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!--
  Tekiō. Two octopus arms: the near one wrapped into a ring, the far one showing
  just inside it — roadmap 038, redrawn in RFC 0079.

  The ring is one wrapped arm, not a band: its centreline rides outward by
  exactly half the width it sheds (r = 39 − w/2), so the outer edge is a true
  circle of radius 39 about (50, 50) and the whole taper lands in the counter.
  Width runs 15 at the root to 5.2 at the tip as w(t) = 5.2 + 9.8·(1−t)^0.85,
  over a sweep of 366° from −45° (half past one) — six degrees more than a full
  turn, so the thin tip lies inside the root's own ink and needs no cap. The
  root does: a true semicircle, which is why the counter ends in a bulb.

  Eight suckers, at half the local width, spaced (i + 0.6)/(n + 0.8) along the
  sweep so they clear both ends. They are real holes, never paper-coloured
  discs, because the colour behind a tab bar or a home screen is unknown — each
  is a subpath wound against the arm, which cuts a hole under the default
  nonzero rule. Not evenodd: the arm laps its own root, and evenodd reads that
  doubly-covered wedge as a hole and gashes the ring there.

  The far arm is the thinnest part of a second arm, 4.4 tapering to 1.4. It
  runs hidden inside the ring's width from 148°, slides out past the inner edge
  over 55° (smoothstep), then follows the inside of the top 1.8 units in,
  drifting to 6 units by its tip at 278° — so a narrow wedge opens between the
  two arms, and the tip stops 6 units short of the ring. Where it passes under
  the ring it is cut back by the ring grown 1.6 units: the gap that says it is
  behind. The start is left sharp on purpose. The cut is a real boolean
  (ring outline offset, then subtracted), so the far arm is plain outline.

  There is no macron. The Ō is spelled by the wordmark; the mark is the
  creature. (A round O under a level bar is a registered mark in this market.)

  Ink reaches x 11–89 and y 11–89 on the 100 grid, centred both ways.
-->
<style>
  .ink { fill: #1a1a1a }
  @media (prefers-color-scheme: dark) { .ink { fill: #ffffff } }
</style>
