<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Tekiō — roadmap 038.

    An octopus arm written as the Ō of Tekiō: one stroke closed into a ring,
    thick where it starts and thinning as it travels, with eight suckers
    punched through it, under a macron drawn with the same brush.

    Geometry on a 0–100 grid: the ring is a true circle of radius 39 about
    (50, 56), so the silhouette is exact; the whole taper is spent on the
    inside, where the counter is a closed spline whose distance from that
    circle is 9.6 + 5·cos φ + 1.4·sin 2φ, φ measured from the root at −95°.
    A periodic width law cannot disagree with itself, so there is no seam
    anywhere in the shape. Eight suckers run one way from the root, 0.5 of the
    band wide, packed towards the thin end the way a real arm packs them, and
    they stop before the waist because an aperture needs about 6 units of band
    to stay open. The macron is a bowed stroke from x 29 to 71 at y 8.5,
    4.2 units thick at the left and 2.4 at the right.

    The suckers are holes, not paper-coloured discs: they are subpaths of the
    ring under fill-rule="evenodd", so the mark reads on a tab bar of any
    colour.

    Ink #1a1a1a is design-system §3's primary. The mark inverts to white on a
    dark tab bar via prefers-color-scheme, so it never disappears into chrome.
  -->
  <style>
    .ink { fill: #1a1a1a }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ffffff }
    }
  </style>
