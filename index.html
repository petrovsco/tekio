<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- roadmap 038 — declaring an icon is also what stops the browser asking
         for /favicon.ico, which was the app's only console error. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Tekiō</title>
    <style>
      /* Splash (RFC 0078) — see the comment on #splash below. z-index clears
         the app's highest layer (z-[201]). */
      #splash {
        position: fixed; inset: 0; z-index: 1000; background: #faf9f7; color: #1a1a1a; fill: #1a1a1a;
        display: flex; align-items: center; justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased; transition: opacity .2s ease-out;
      }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash .m { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: -6vh; animation: sp-in 0s .25s both; }
      #splash svg { width: 84px; height: 84px; display: block; }
      #splash .w { font-size: 15px; font-weight: 700; letter-spacing: .14em; margin-right: -.14em; animation: sp-word .5s cubic-bezier(.2, 0, .2, 1) 1.15s both; }
      #splash .r { stroke-dasharray: 1 2; animation: sp-draw 1.1s cubic-bezier(.5, 0, .25, 1) .25s both; }
      #splash .b { transform-box: fill-box; transform-origin: center; animation: sp-touch .14s ease-out .25s both; }
      #splash .mr { transform-box: fill-box; transform-origin: left center; animation: sp-mac .38s cubic-bezier(.3, 0, .2, 1) .97s both; }
      #splash .d { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: sp-open .26s ease-out both; }
      @keyframes sp-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sp-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes sp-touch { from { transform: scale(.2); opacity: 0; } }
      @keyframes sp-mac { from { transform: scaleX(0); } }
      @keyframes sp-word { from { opacity: 0; letter-spacing: .26em; } }
      @keyframes sp-open { from { transform: scale(1); } to { transform: scale(0); } }
      @media (prefers-reduced-motion: reduce) {
        #splash .r, #splash .b, #splash .mr, #splash .w, #splash .d { animation: none; }
        #splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <!-- Splash (RFC 0078). Plain SVG and CSS in the document, not React, so it
         paints before the ~350 kB entry chunk has arrived, where the page used
         to be blank. dismissSplash() in src/lib/splash.ts removes it the moment
         bootstrap() settles; there is no minimum time on screen, and nothing
         shows for the first 250 ms, so a fast load never sees it at all.

         The mark is public/favicon.svg rebuilt from the construction its own
         comment states — outer edge a true circle r 39 about (50, 56), inner
         edge 39 − w(t) with w(t) = 5.2 + 9.8·(1−t)^0.85 over 366° from −45°, a
         semicircle cap at the root, round suckers — as arcs instead of dense
         Béziers: 1.8 kB against 21 kB, within anti-aliasing of the favicon at
         400 px. It is revealed the way it was drawn: a mask stroke follows the
         centreline, r = 39 − w/2, root to tip. Each
         sucker is an ink disc laid over its real hole and scaled away 0.1 s
         after the brush passes it; the delays invert the curl's easing at
         t = (i + 0.6)/8.8. Change the logo and these numbers are regenerated
         with it, not hand-tuned. -->
    <div id="splash" aria-hidden="true">
      <div class="m">

          <g mask="url(#sp-mac)"><path d="M29,6.4L30.75,6.32L32.5,6.24L34.25,6.17L36,6.1L37.75,6.04L39.5,5.99L41.25,5.95L43,5.92L44.75,5.91L46.5,5.91L48.25,5.92L50,5.95L51.75,6L53.5,6.06L55.25,6.13L57,6.22L58.75,6.32L60.5,6.44L62.25,6.56L64,6.7L65.75,6.84L67.5,6.99L69.25,7.15L71,7.3L71,9.7L69.25,9.62L67.5,9.54L65.75,9.47L64,9.4L62.25,9.34L60.5,9.29L58.75,9.25L57,9.22L55.25,9.21L53.5,9.21L51.75,9.22L50,9.25L48.25,9.3L46.5,9.36L44.75,9.43L43,9.52L41.25,9.62L39.5,9.74L37.75,9.86L36,10L34.25,10.14L32.5,10.29L30.75,10.45L29,10.6Z"/><circle cx="29" cy="8.5" r="2.1"/><circle cx="71" cy="8.5" r="1.2"/></g>

    </div>
    <div id="root"></div>
    <!-- If the bundle throws before React mounts, dismissSplash() never runs;
         a mark that waits forever would say "loading" about a page that is not. -->
    <script>addEventListener('error', function () { var s = document.getElementById('splash'); if (s) s.remove() })</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
